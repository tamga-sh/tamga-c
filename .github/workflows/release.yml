name: Release

# release-please maintains CHANGELOG.md, the tag, and the four places the
# version appears (CMakeLists.txt, include/tamga.h, and both vcpkg.json
# files) via release-please-config.json's extra-files. Keeping those in the
# config rather than in a hand-maintained step is what stops them drifting --
# through v1.2 the CMake project version still said 0.1.0 while the repository
# was tagged v1.2.2.
#
# On release: build every target via build-native.yml (reusable
# workflow_call), package each one, and attach the archives to the GitHub
# Release.
#
# GitHub Releases is the artifact store. A vcpkg port lives in vcpkg-port/ for
# registry submission; publishing it is a separate, manual step.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # 10-23s across 18 observed runs -- it only mints a token and calls the
    # GitHub API. 15 is far more than it can legitimately need; it exists so
    # a wedged API call fails the release instead of parking a runner for 6h.
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The release PR must be authored by the GitHub App, not the default
      # GITHUB_TOKEN: GitHub refuses to trigger workflows from events an
      # Actions token created (loop prevention), so a GITHUB_TOKEN-authored
      # release PR never gets the required status checks and can only be
      # merged with an admin override. App-authored PRs do trigger CI.
      # Scope the token to the release-PR step only.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

  build-native:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    # No timeout-minutes here on purpose: GitHub rejects it on a job that
    # calls a reusable workflow ("Invalid workflow file"). The bound lives on
    # the `build` job inside build-native.yml instead -- do not "fix" this by
    # adding one here.
    uses: ./.github/workflows/build-native.yml

  package-and-attach:
    needs: [release-please, build-native]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # 17-26s across 6 observed runs (download 8 artifacts, tar/zip, upload).
    # 20 is generous headroom for a slow GitHub artifact or upload API day
    # while still bounding a wedged transfer.
    timeout-minutes: 20
    # Explicit, not inherited from the top-level `permissions:` block —
    # softprops/action-gh-release@v2's asset-upload path failed with
    # "Resource not accessible by integration" while re-fetching the
    # already-created release even though the workflow-level permissions
    # already included contents: write. Declaring it directly on this job
    # is the confirmed fix (softprops/action-gh-release#572).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all per-target build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Package per-target archives (.tar.gz Unix, .zip Windows)
        # Each downloaded directory is already a complete install tree --
        # headers, libraries and the CMake package config -- staged by
        # build-native.yml's `cmake --install`. Nothing is copied in here;
        # anything missing from an archive is missing from the install rules,
        # which is where it should be fixed.
        run: |
          set -euo pipefail
          mkdir -p out
          for dir in dist/*/; do
            name=$(basename "$dir")
            case "$name" in
              *windows*) (cd dist && zip -r "../out/$name.zip" "$name") ;;
              *)         tar -czf "out/$name.tar.gz" -C dist "$name" ;;
            esac
          done
          ls -l out

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            out/*.tar.gz
            out/*.zip
