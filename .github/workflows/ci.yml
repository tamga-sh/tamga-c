name: CI

on:
  push:
    branches: [main]
  pull_request:

# UNBLOCKED: tamga-rust published to crates.io (0.2.0+), so the
# [patch.crates-io] override that used to point this crate at a sibling
# ../tamga-rust checkout is gone -- Cargo.toml's `tamga_rust = { package =
# "tamga", version = "0.2" }` resolves from crates.io like any other
# dependency, in this standalone CI checkout same as locally.

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-coverage:
    name: clippy, clang-format, header freshness, coverage, deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install cargo-binstall
        uses: taiki-e/install-action@cargo-binstall

      - name: Install cbindgen, cargo-llvm-cov, cargo-deny via binstall
        run: cargo binstall --no-confirm cbindgen cargo-llvm-cov cargo-deny

      - name: cargo clippy --all-targets -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: clang-format --dry-run --Werror (tests/c/, examples/)
        run: |
          find tests/c examples -type f \( -name '*.c' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

      - name: Header freshness gate (cbindgen regenerate + diff)
        run: |
          cargo build --lib
          git diff --exit-code include/tamga.h

      - name: cargo llvm-cov (70% line gate)
        # Lower than this org's usual 80% norm: most of the underlying
        # crypto/parsing logic is already covered by tamga-rust's own test
        # suite. This layer is marshalling/lifecycle glue over that -- see
        # CLAUDE.md's "Coverage gate: 70%, not 80%" section for the full
        # rationale, not just this comment.
        run: cargo llvm-cov --fail-under-lines 70

      - name: cargo deny check
        # Enforces the `rsa` crate ban (RUSTSEC-2023-0071) inherited from
        # tamga-rust's house policy -- see CLAUDE.md.
        run: cargo deny check

  build-and-test:
    name: build + ctest (${{ matrix.os }})
    needs: lint-and-coverage
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Configure (CMake + corrosion)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (native cdylib/staticlib + C test harness)
        run: cmake --build build --config Release

      - name: ctest
        run: ctest --test-dir build --output-on-failure -C Release
