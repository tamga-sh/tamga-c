name: Build Native

# Reusable workflow_call job: builds the release artefacts for every target.
#
# Through v1.2 this cross-compiled a Rust crate and additionally produced iOS
# device and simulator slices for tamga-swift's XCFramework pipeline. Both are
# gone: the library is plain C, so the toolchain is whatever the runner
# already has, and tamga-swift dropped its tamga-c binding in favour of a
# native Swift implementation on 2026-08-12, taking the only consumer of the
# iOS slices with it. Nothing in the fleet calls this workflow but
# release.yml.
#
# Linux aarch64 is cross-compiled with the distribution's own
# gcc-aarch64-linux-gnu. That is a build-time tool on the CI runner, not a
# dependency of the library -- the produced artefact still links against libc
# alone plus, where present, the system libcurl.

on:
  workflow_call: {}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            cmake_args: ""
          - name: linux-aarch64
            os: ubuntu-latest
            cross: aarch64
            cmake_args: >-
              -DCMAKE_SYSTEM_NAME=Linux
              -DCMAKE_SYSTEM_PROCESSOR=aarch64
              -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc
              -DTAMGA_HTTP=none
          # A single universal binary rather than two per-arch ones: it is
          # what a macOS consumer actually wants to link, and lipo is right
          # here.
          - name: macos-universal
            os: macos-14
            # Quoted, because this string is pasted into a shell command and a
            # bare semicolon splits it there. Unquoted, the Configure step ran
            # `cmake ... -DCMAKE_OSX_ARCHITECTURES=x86_64` and then tried to
            # run `arm64` as a command -- exit 127, and had it not exited the
            # artefact would have been x86_64-only rather than universal.
            cmake_args: '-DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"'
          - name: windows-x86_64
            os: windows-latest
            cmake_args: ""
    steps:
      - uses: actions/checkout@v7

      - name: Install libcurl (Linux)
        if: runner.os == 'Linux' && matrix.cross != 'aarch64'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      # The cross build ships without a transport: pulling a foreign-arch
      # libcurl into the runner is more machinery than it is worth for an
      # artefact whose consumers can register their own. The offline surface
      # is complete either way.
      - name: Install the aarch64 cross compiler
        if: matrix.cross == 'aarch64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DTAMGA_C_BUILD_TESTS=OFF ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release

      - name: Stage
        shell: bash
        run: |
          cmake --install build --prefix "dist/${{ matrix.name }}" --config Release
          cp LICENSE README.md "dist/${{ matrix.name }}/"
          ls -R "dist/${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: tamga-c-${{ matrix.name }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error
