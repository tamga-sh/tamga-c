[package]
name = "tamga-c"
version = "0.1.0"
edition = "2024"
description = "C ABI bindings for the Tamga licensing SDK. Exposes tamga-rust's offline-verification primitives (license-file, machine-file, offline-proof, key derivation) through a stable C ABI."
license = "MIT"
repository = "https://github.com/tamga-sh/tamga-c"
publish = false # GitHub Releases is the v0.1 artifact store, not crates.io — see .github/workflows/release.yml.

# NOTE(rlib-vs-cdylib gotcha, RESOLVED): "rlib" is included alongside
# cdylib/staticlib specifically so `tests/*.rs` integration tests (Rust's
# normal `cargo test` mechanism) can link against this crate via
# `--extern`. This does mean an unused .rlib artifact lands in target/
# during a release build, but nothing downstream packages or ships it —
# release.yml's packaging step only picks up the built cdylib/staticlib +
# include/tamga.h, never scoops up everything under target/. Cargo has no
# native per-profile crate-type mechanism, so "harmless extra build
# artifact" is the pragmatic tradeoff versus driving every test through the
# C ABI instead of native Rust `#[test]`s.
[lib]
name = "tamga"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Path dependency on the tamga-rust reference implementation (in-repo dev).
# tamga-rust's Sections A-M are complete and its public API is stable
# (see ../tamga-rust/docs/plans/tamga-rust.plan.md), but it has not been
# through an actual `cargo publish` to crates.io in this session — no
# crates.io credentials/CI run available offline. The path dependency stays
# the real, resolvable dependency for this repo's own implementation work;
# swap to the crates.io line below only once a real publish has happened.
#
# NOTE(crate-name collision, RESOLVED): keyed as `tamga_rust` (not `tamga`)
# deliberately. This package's own `[lib] name` below is "tamga" — chosen so
# the built shared library is `libtamga.so`/`tamga.h`, matching the C-facing
# product name — and Cargo forbids one package from depending on a crate
# under a name that collides with its own lib's extern name once integration
# tests (which implicitly link both) enter the picture. Internal source
# refers to this dependency as `tamga_rust::...` throughout.
tamga_rust = { package = "tamga", path = "../tamga-rust" }
# Swap to this once tamga-rust 0.1.0 is actually published to crates.io:
# tamga_rust = { package = "tamga", version = "0.1" }
# Only for re-serializing tamga-rust's already-`Serialize`-derived response
# models into owned JSON C strings (`tamga_*_get_json`) — no independent
# JSON handling of our own.
serde_json = "1"

[build-dependencies]
# NOTE(cbindgen version, RESOLVED): pinned >=0.29, not 0.27 as originally
# scaffolded. cbindgen 0.27's syn-based parser silently fails to recognize
# items annotated with the edition-independent `#[unsafe(no_mangle)]`
# attribute syntax (RFC 3325) that this crate's `extern "C" fn`s use — it
# doesn't error, it just emits zero declarations for them, which is exactly
# the empty-header failure mode this crate's own header-freshness CI gate
# exists to catch. Confirmed via a minimal reproduction crate: 0.27 silently
# drops `#[unsafe(no_mangle)] pub unsafe extern "C" fn ...`; 0.29 handles it
# correctly. Reverting to bare `#[no_mangle]` was considered and rejected —
# it would reintroduce the `unsafe_attr_outside_unsafe` lint warning under
# this crate's `cargo clippy -- -D warnings` gate.
cbindgen = "0.29"

[dev-dependencies]
# Test-fixture-building only — building known-good `.lic`/`.mach` PEMs the
# same way the real server does, using the same crate versions tamga-rust's
# own crypto tests use (see ../tamga-rust/Cargo.toml).
ed25519-dalek = "2"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
# RSA-2048 (PKCS#1 v1.5 + PSS) and ECDSA P-256 test fixture signing —
# deliberately NOT the `rsa` crate, same house ban as tamga-rust
# (RUSTSEC-2023-0071, unpatched Marvin timing attack).
aws-lc-rs = "1"
