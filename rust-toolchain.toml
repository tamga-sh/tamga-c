# Pinned to the same channel tamga-rust uses, for reproducible builds of the
# tamga-rust dependency (see Cargo.toml).
#
# "stable" here is a placeholder assumption. Re-check this against
# tamga-rust's actual rust-toolchain.toml and pin to the identical
# channel/version — a mismatch here silently breaks the reproducibility this
# file exists to guarantee.
[toolchain]
channel = "stable"
components = ["clippy", "rustfmt"]
