# cargo-deny configuration. Run locally with `cargo deny check`; CI runs the
# same command in .github/workflows/ci.yml. Modeled on tamga-rust's deny.toml
# (inherited house policy — see this repo's CLAUDE.md "Critical Dependency
# Notes").

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",       # icu4x crates, transitive via tamga-rust's reqwest/idna
    "CDLA-Permissive-2.0", # webpki-roots, transitive via tamga-rust's reqwest/rustls-tls
    "MPL-2.0",             # cbindgen (build-dependency only, not shipped in any built artifact)
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# RUSTSEC-2023-0071 (Marvin timing attack on RSA PKCS#1 v1.5 decryption) is
# unpatched in the `rsa` crate. This crate uses `aws-lc-rs` for all RSA
# operations instead (via tamga-rust's crypto::rsa module). Do not add `rsa`
# as a dependency, direct or transitive, without re-litigating this ban.
deny = [{ name = "rsa" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
